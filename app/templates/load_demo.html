{% extends "base.html" %}
{% set active_page = "upload" %}

{% block title %}Load Demo Dataset - MPLADS AI{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-7 col-xl-6">
      <div class="card border shadow-sm rounded-4 p-4 p-md-5 bg-white text-center">
        <div class="kpi-icon-box bg-primary-subtle text-primary mx-auto mb-3"><i class="bi bi-database-fill-gear"></i></div>
        <h3 class="fw-bold mb-2">Load benchmark dataset?</h3>
        <p class="text-muted mb-4">This processes the 5,000-project synthetic dataset and replaces the current in-memory analysis results.</p>
        <form method="POST" action="{{ url_for('views.load_demo_data') }}" class="d-flex flex-wrap justify-content-center gap-2">
          <button type="submit" class="btn btn-primary"><i class="bi bi-play-fill me-1"></i> Load Dataset & Run Analysis</button>
          <a href="{{ url_for('views.dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
